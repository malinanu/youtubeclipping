# ClipForge stack for Portainer (Stacks → Add stack → Repository, compose path: deploy/portainer-stack.yml).
#
# Uses your EXISTING Postgres (reached through the Docker host gateway 172.17.0.1 /
# host.docker.internal where its port is published), a small private Redis for the job
# queue (bundled below), and prebuilt arm64 images from GHCR. CloudPanel's nginx is the public entry point:
#   /api/* → 127.0.0.1:${API_PORT}   everything else → 127.0.0.1:${WEB_PORT}
# See docs/DEPLOY-PORTAINER.md for the variables to set in Portainer.

x-logging: &logging
  driver: json-file
  options: { max-size: "20m", max-file: "5" }

x-backend: &backend
  image: ghcr.io/malinanu/clipforge-backend:${CLIPFORGE_TAG:-latest}
  restart: unless-stopped
  environment:
    DATABASE_URL: ${DATABASE_URL:?set DATABASE_URL}
    # Defaults to the bundled queue Redis. Set REDIS_ADDR only to use an external one.
    REDIS_ADDR: ${REDIS_ADDR:-redis:6379}
    REDIS_PASSWORD: ${REDIS_PASSWORD:-}
    REDIS_DB: ${REDIS_DB:-0}
    ADMIN_EMAIL: ${ADMIN_EMAIL:?set ADMIN_EMAIL}
    ADMIN_PASSWORD_HASH: ${ADMIN_PASSWORD_HASH:?set ADMIN_PASSWORD_HASH}
    SESSION_SECRET: ${SESSION_SECRET:?set SESSION_SECRET}
    COOKIE_SECURE: ${COOKIE_SECURE:-true}
    AI_PROVIDER: ${AI_PROVIDER:-auto}
    ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
    CLAUDE_MODEL: ${CLAUDE_MODEL:-claude-opus-5-5}
    GEMINI_API_KEY: ${GEMINI_API_KEY:-}
    GEMINI_MODEL: ${GEMINI_MODEL:-gemini-3.5-flash-lite}
    OPENAI_API_KEY: ${OPENAI_API_KEY:-}
    GROQ_API_KEY: ${GROQ_API_KEY:-}
    POSTIZ_API_URL: ${POSTIZ_API_URL:-}
    POSTIZ_API_KEY: ${POSTIZ_API_KEY:-}
    WHISPER_MODEL: ${WHISPER_MODEL:-small}
    WHISPER_THREADS: ${WHISPER_THREADS:-4}
    FFMPEG_THREADS: ${FFMPEG_THREADS:-4}
    RENDER_CONCURRENCY: ${RENDER_CONCURRENCY:-1}
    TRANSCRIBE_CONCURRENCY: ${TRANSCRIBE_CONCURRENCY:-1}
    INGEST_CONCURRENCY: ${INGEST_CONCURRENCY:-2}
    PROXY_HEIGHT: ${PROXY_HEIGHT:-360}
    MEDIA_RETENTION_DAYS: ${MEDIA_RETENTION_DAYS:-14}
    MAX_UPLOAD_GB: ${MAX_UPLOAD_GB:-20}
    UPLOAD_CHUNK_MB: ${UPLOAD_CHUNK_MB:-8}
    YTDLP_PROXY: ${YTDLP_PROXY:-}
    YTDLP_EXTRA_ARGS: ${YTDLP_EXTRA_ARGS:-}
    YTDLP_POT_URL: http://bgutil:4416
  volumes:
    - media:/data
    - models:/models   # whisper models, downloaded automatically on first start
  extra_hosts:
    - "host.docker.internal:host-gateway"
  depends_on:
    redis: { condition: service_healthy }
  logging: *logging

services:
  # Private Redis for ClipForge's job queue: not published, persistent, never evicts jobs.
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--maxmemory-policy", "noeviction"]
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 20
    logging: *logging

  api:
    <<: *backend
    command: ["api"]
    ports:
      - "127.0.0.1:${API_PORT:-18080}:8080"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/healthz"]
      interval: 15s
      retries: 10

  worker:
    <<: *backend
    command: ["worker"]
    stop_grace_period: 30s

  web:
    image: ghcr.io/malinanu/clipforge-web:${CLIPFORGE_TAG:-latest}
    restart: unless-stopped
    ports:
      - "127.0.0.1:${WEB_PORT:-13000}:3000"
    logging: *logging

  # Generates YouTube PO tokens so yt-dlp looks less like a bot from datacenter IPs.
  bgutil:
    image: brainicism/bgutil-ytdlp-pot-provider:latest
    restart: unless-stopped
    init: true
    logging: *logging

volumes:
  media:
  models:
  redisdata:

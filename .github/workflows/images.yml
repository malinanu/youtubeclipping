name: Build images

# Builds linux/arm64 images for Oracle Ampere and pushes them to GHCR.
# Portainer pulls ghcr.io/malinanu/clipforge-{backend,web}:<tag>.
on:
  push:
    branches: [main]
    tags: ["v*"]
    paths: ["api/**", "web/**", ".github/workflows/images.yml"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: images-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: api/go.mod
          cache-dependency-path: api/go.sum
      - name: Go tests
        working-directory: api
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg fonts-montserrat >/dev/null
          go vet ./...
          go test ./...
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Web typecheck + build
        working-directory: web
        run: |
          npm ci --no-audit --no-fund
          npx tsc --noEmit
          npm run build

  image:
    needs: test
    # Native arm64 runners are free for public repos; private repos fall back to QEMU emulation
    # (slow first build, then the whisper.cpp layer is cached).
    runs-on: ${{ github.event.repository.private && 'ubuntu-latest' || 'ubuntu-24.04-arm' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: backend
            context: api
            build-args: |
              WHISPER_NATIVE=OFF
              WHISPER_ARM_ARCH=armv8.2-a+dotprod+fp16
              WHISPER_MODELS=small
          - name: web
            context: web
            build-args: |
              API_INTERNAL_URL=http://api:8080
    steps:
      - uses: actions/checkout@v4

      - name: Set up QEMU (private repo on x86 runner)
        if: ${{ github.event.repository.private }}
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/clipforge-${{ matrix.name }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=sha,prefix=sha-

      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          platforms: linux/arm64
          push: true
          build-args: ${{ matrix.build-args }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}
